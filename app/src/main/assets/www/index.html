<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Puesto Idle</title>
<style>
@font-face{font-family:'Baloo 2';font-weight:500;font-display:swap;src:url(fonts/baloo-2-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Baloo 2';font-weight:600;font-display:swap;src:url(fonts/baloo-2-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Baloo 2';font-weight:700;font-display:swap;src:url(fonts/baloo-2-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Baloo 2';font-weight:800;font-display:swap;src:url(fonts/baloo-2-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Chango';font-weight:400;font-display:swap;src:url(fonts/chango-latin-400-normal.woff2) format('woff2')}
:root{
  color-scheme: dark;
  --night:#0E161C; --ink:#15212A; --card:#1D2C37; --card-2:#243644; --line:#2B3F4D; --well:#0F1A21;
  --cream:#FFF3DC; --cream-2:#CDBFA8; --muted:#8E9EA8;
  --marigold:#F4A62A; --marigold-ink:#3A2303; --rosa:#E8467C; --jade:#2BB39A;
  --display:'Chango','Baloo 2',system-ui,sans-serif;
  --ui:'Baloo 2',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink)}
body{color:var(--cream);font:500 15px/1.3 var(--ui);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--ink);overflow:hidden}
@media (min-width:500px){body{background:var(--night)}#app{border-inline:1px solid var(--line)}}

.hud{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px}
.wallet{flex:1;min-width:0}
.money{font-family:var(--display);font-size:30px;line-height:1.05;letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate{font-size:13px;font-weight:700;color:var(--cream-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate .st-count{color:var(--marigold)}
.dbg{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--rosa);color:#fff;font-size:11px;font-weight:800;vertical-align:1px}
.boost{flex:none;display:flex;align-items:center;gap:7px;min-height:40px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--jade);background:transparent;color:var(--jade);font-weight:800;font-size:13px;line-height:1.05;cursor:pointer;text-align:left}
.boost .play{flex:none;width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.boost.free .play{display:none}
.boost.on{background:var(--jade);color:#06231D}
.icon-btn{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;padding:0}
.icon-btn i,.icon-btn i::before,.icon-btn i::after{display:block;width:16px;height:2px;border-radius:2px;background:var(--cream);position:relative}
.icon-btn i::before,.icon-btn i::after{content:"";position:absolute;left:0}
.icon-btn i::before{top:-5px}.icon-btn i::after{top:5px}

.scene{position:relative;flex:none;height:clamp(190px,33vh,290px);background:#233B57}
.scene canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.toast{position:absolute;left:50%;bottom:10px;transform:translate(-50%,8px);max-width:calc(100% - 32px);padding:6px 14px;border-radius:999px;background:rgba(14,22,28,.92);color:var(--cream);font-weight:700;font-size:14px;text-align:center;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

.hint{flex:none;display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 16px;background:#1A2833;border-block:1px solid #0B1217;font-weight:700;font-size:15px;line-height:1.2}
.hint::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--marigold);box-shadow:0 0 0 4px rgba(244,166,42,.18)}

.tabs{flex:none;display:flex;gap:4px;margin:10px 16px 0;padding:4px;background:var(--well);border-radius:14px}
.tab{flex:1;position:relative;min-height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:800;font-size:15px;cursor:pointer;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{background:var(--card-2);color:var(--cream)}
.tab .dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--rosa)}
.panels{flex:1;min-height:0;overflow-y:auto;padding:10px 16px 28px;-webkit-overflow-scrolling:touch}
.panel{display:flex;flex-direction:column;gap:10px}

.buybar{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--well)}
.seg button{min-width:48px;min-height:30px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:800;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card-2);color:var(--cream)}

.st{--c:var(--marigold);display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.st-cook{position:relative;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.st-icon{width:64px;height:64px;border-radius:50%;background:var(--well);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--c) 45%,transparent)}
.st-icon.pop{animation:pop .18s ease-out}
@keyframes pop{50%{transform:scale(.9)}}
.st-info{display:flex;flex-direction:column;gap:5px;min-width:0}
.st-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.st-name{font-family:var(--display);font-size:18px;line-height:1.1;letter-spacing:.01em}
.st-lvl{font-weight:800;font-size:13px;color:var(--cream-2);white-space:nowrap}
.bar{position:relative;display:block;height:24px;border-radius:12px;background:var(--well);overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left center;transform:scaleX(0);background:var(--c)}
.bar.full i{transform:scaleX(1);background:repeating-linear-gradient(-45deg,var(--c) 0 10px,color-mix(in srgb,var(--c) 70%,#fff) 10px 20px);background-size:28px 28px;animation:stripes .5s linear infinite}
@keyframes stripes{to{background-position:28px 0}}
.bar-t{position:relative;display:flex;justify-content:space-between;align-items:center;height:100%;padding:0 10px;font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
.st-ms{font-size:12.5px;font-weight:600;color:var(--cream-2);line-height:1.25}
.chip{display:inline-block;margin-right:4px;padding:0 7px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--cream);font-weight:800}
.hand{position:absolute;left:18px;top:40px;font-size:34px;line-height:1;pointer-events:none;animation:tap 1s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
@keyframes tap{0%,100%{transform:translate(0,0)}50%{transform:translate(-3px,-9px)}}
.st.locked .st-name{color:var(--cream-2)}
.st-actions{display:flex;gap:8px}

.btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:46px;padding:5px 10px;border:0;border-radius:12px;font-weight:800;font-size:13px;line-height:1.1;cursor:pointer;transition:transform .08s;text-align:center}
.btn:active{transform:scale(.97)}
.btn b{font-size:16px;font-variant-numeric:tabular-nums}
.btn.buy{background:var(--marigold);color:var(--marigold-ink)}
.btn.mgr{background:var(--rosa);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--cream)}
.btn.cant{background:#2A3945;color:#8595A0}
.btn.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(244,166,42,0)}50%{box-shadow:0 0 0 6px rgba(244,166,42,.45)}}
.btn.mgr.pulse{animation-name:pulseR}
@keyframes pulseR{0%,100%{box-shadow:0 0 0 0 rgba(232,70,124,0)}50%{box-shadow:0 0 0 6px rgba(232,70,124,.5)}}

.up{display:grid;grid-template-columns:48px 1fr 108px;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.up canvas{width:48px;height:48px;border-radius:50%;background:var(--well)}
.up-name{font-weight:800;font-size:15px;line-height:1.15}
.up-eff{font-size:13px;font-weight:700;color:var(--marigold)}
.up.lock{opacity:.55}
.up .btn{min-height:42px}
.note{font-size:13px;color:var(--muted);text-align:center;padding:4px 8px;margin:0}

.b-card{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.b-name{font-family:var(--display);font-size:24px;line-height:1.05}
.b-stats{font-weight:700;color:var(--cream-2)}
.b-stats b{color:var(--marigold)}
.b-pending{font-family:var(--display);font-size:34px;line-height:1;color:var(--marigold)}
.b-card p{margin:0;font-size:14px;line-height:1.4;color:var(--cream-2)}
.b-card p strong{color:var(--cream)}
.b-reco{padding:8px 10px;border-radius:10px;background:rgba(43,179,154,.14);color:#8FE3D2;font-weight:700;font-size:14px}
.row{display:flex;gap:8px}
.big{min-height:52px;font-size:15px}

.modal{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px;background:rgba(6,10,13,.66)}
.sheet{width:100%;max-height:100%;overflow:auto;padding:18px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.sheet p{margin:0;color:var(--cream-2);line-height:1.4}
.sheet .amount{font-family:var(--display);font-size:38px;line-height:1;color:var(--marigold)}
.sheet .small{font-size:12.5px;color:var(--muted)}
.sheet textarea{width:100%;min-height:170px;resize:none;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--well);color:var(--cream);font:600 13px/1.45 ui-monospace,Menlo,Consolas,monospace;-webkit-user-select:text;user-select:text}
.menu-sec{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.menu-sec h3{margin:0;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ad{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px;background:#05080A}
.ad-box{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:var(--cream-2)}
.ad-tag{padding:3px 10px;border-radius:6px;border:1px solid var(--muted);font-size:12px;font-weight:800;letter-spacing:.1em}
.ad-count{font-family:var(--display);font-size:64px;line-height:1;color:var(--cream)}
.ad-box p{margin:0;max-width:260px;line-height:1.4}

@media (prefers-reduced-motion:reduce){.hand,.pulse,.bar.full i,.st-icon.pop,.sheet{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="wallet">
      <div class="money" id="money">$0</div>
      <div class="rate" id="rate"></div>
    </div>
    <button class="boost" id="boost" type="button" hidden><span class="play"></span><span id="boostTxt"></span></button>
    <button class="icon-btn" id="menuBtn" type="button"><i></i></button>
  </header>

  <div class="scene" id="sceneWrap">
    <canvas id="scene"></canvas>
    <div class="toast" id="toast" role="status"></div>
  </div>

  <div class="hint" id="hint" role="status" aria-live="polite"><span id="hintText"></span></div>

  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button class="tab" role="tab" type="button" data-tab="cocina" aria-selected="true"><span data-t="tabKitchen"></span></button>
    <button class="tab" role="tab" type="button" data-tab="mejoras" aria-selected="false"><span data-t="tabUpgrades"></span><i class="dot" hidden></i></button>
    <button class="tab" role="tab" type="button" data-tab="barrio" aria-selected="false"><span data-t="tabBarrio"></span><i class="dot" hidden></i></button>
  </nav>

  <div class="panels" id="panels">
    <section class="panel" id="panel-cocina">
      <div class="buybar" id="buybar" hidden><span data-t="buyEach"></span>
        <div class="seg" role="group">
          <button type="button" data-mode="1" aria-pressed="true">×1</button>
          <button type="button" data-mode="10" aria-pressed="false">×10</button>
          <button type="button" data-mode="max" aria-pressed="false" data-t="max"></button>
        </div>
      </div>
      <div class="panel" id="stations"></div>
    </section>
    <section class="panel" id="panel-mejoras" hidden></section>
    <section class="panel" id="panel-barrio" hidden>
      <div class="b-card">
        <div class="eyebrow" data-t="bYour"></div>
        <div class="b-name" id="bName"></div>
        <div class="b-stats" id="bStats"></div>
      </div>
      <div class="b-card">
        <div class="eyebrow" data-t="bIf"></div>
        <div class="b-pending" id="bPending"></div>
        <div class="b-reco" id="bReco" hidden></div>
        <p id="bExplain"></p>
        <p id="bNext"></p>
        <button class="btn buy big" id="bGo" type="button"></button>
        <div id="bConfirm" hidden>
          <p style="margin-bottom:10px" data-t="bConfirm"></p>
          <div class="row"><button class="btn buy big" id="bYes" type="button" data-t="bYes"></button><button class="btn ghost big" id="bNo" type="button" data-t="bNo"></button></div>
        </div>
      </div>
    </section>
  </div>

  <div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
  <div class="ad" id="ad" hidden><div class="ad-box"><div class="ad-tag" id="adTag"></div><div class="ad-count" id="adCount">3</div><p id="adText"></p></div></div>
</div>
<script src="i18n.js"></script>
<script src="game.js"></script>
</body>
</html>
